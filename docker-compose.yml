# docker-compose.yml

services:

  # ─────────────────────────────────────────────────────────
  # NGINX — Reverse Proxy
  # Sits in front of all Node.js app containers
  # Listens on port 80, forwards to app1 (and app2/app3 when scaled)
  # Mounts nginx.conf from local nginx/ directory into container
  # depends_on app1 — nginx starts only after app1 is up
  # ─────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: lms-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
    restart: unless-stopped
    networks:
      - lms-network

  # ─────────────────────────────────────────────────────────
  # APP1 — Primary Node.js instance (always active)
  # Port 5000 no longer exposed to host — internal only
  # Only Nginx can reach it via lms-network
  # ─────────────────────────────────────────────────────────
  app1:
    build: .
    container_name: lms-backend-1
    expose:
      - "5000"
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - lms-network

  # ─────────────────────────────────────────────────────────
  # APP2 — Second Node.js instance (horizontal scaling)
  # Uncomment this entire block when you want to scale up
  # Also uncomment 'server app2:5000' in nginx/nginx.conf upstream
  # Nginx will round-robin between app1 and app2 automatically
  # ─────────────────────────────────────────────────────────
  # app2:
  #   build: .
  #   container_name: lms-backend-2
  #   expose:
  #     - "5000"
  #   env_file:
  #     - .env
  #   depends_on:
  #     - redis
  #   restart: unless-stopped
  #   networks:
  #     - lms-network

  # ─────────────────────────────────────────────────────────
  # APP3 — Third Node.js instance (further scaling)
  # Uncomment when scaling beyond 2 instances
  # Also uncomment 'server app3:5000' in nginx/nginx.conf upstream
  # ─────────────────────────────────────────────────────────
  # app3:
  #   build: .
  #   container_name: lms-backend-3
  #   expose:
  #     - "5000"
  #   env_file:
  #     - .env
  #   depends_on:
  #     - redis
  #   restart: unless-stopped
  #   networks:
  #     - lms-network

  # ─────────────────────────────────────────────────────────
  # REDIS — Cache layer
  # Shared across all app instances (app1, app2, app3)
  # This is the correct approach — one Redis, multiple Node instances
  # All instances read/write the same cache
  # Port 6379 kept exposed for local debugging via Redis CLI
  # ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: lms-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - lms-network

networks:
  lms-network:

volumes:
  redis-data: