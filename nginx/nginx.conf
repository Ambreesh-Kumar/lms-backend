# nginx/nginx.conf

# ─────────────────────────────────────────────────────────────
# WORKER PROCESSES
# auto — Nginx uses all available CPU cores
# Why: Default is 1 — wastes CPU on multi-core servers
# AWS EC2 free tier has 1 core so auto = 1 there too
# ─────────────────────────────────────────────────────────────
worker_processes auto;

events {
    # Max simultaneous connections per worker
    # 1024 is safe for free tier — increase on larger instances
    worker_connections 1024;
}

http {

    # ─────────────────────────────────────────────────────────
    # LOGGING
    # access_log — logs every request (method, path, status, IP)
    # error_log  — logs Nginx errors, 'warn' level and above
    # Why: Essential for debugging and monitoring production issues
    # ─────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ─────────────────────────────────────────────────────────
    # KEEPALIVE
    # How long to keep an idle client connection open (seconds)
    # Why: Reusing TCP connections is faster than opening new ones
    #      every request — avoids TCP handshake overhead
    # ─────────────────────────────────────────────────────────
    keepalive_timeout 65;

    # ─────────────────────────────────────────────────────────
    # GZIP COMPRESSION
    # Compresses responses before sending to client
    # Why: Reduces response size by 60-70% — faster delivery,
    #      less bandwidth usage, better mobile performance
    #
    # gzip_types      — only compress these MIME types
    # gzip_min_length — don't compress responses smaller than 1KB
    #                   (small responses cost more CPU than they save)
    # gzip_comp_level — 1 (fastest) to 9 (smallest) — 6 is balanced
    # gzip_vary       — adds 'Vary: Accept-Encoding' header so CDNs
    #                   and proxies cache both compressed + uncompressed
    # ─────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_vary on;

    # ─────────────────────────────────────────────────────────
    # SECURITY HEADERS
    #
    # server_tokens off      — hides Nginx version from responses
    #                          (attackers can't target known exploits)
    #
    # X-Frame-Options        — prevents your site from being loaded
    #                          inside an iframe (clickjacking protection)
    #
    # X-XSS-Protection       — tells browser to block XSS attacks
    #                          (legacy header, modern browsers use CSP)
    #
    # X-Content-Type-Options — prevents browser from guessing MIME type
    #                          e.g. serving a .txt file as JavaScript
    # ─────────────────────────────────────────────────────────
    server_tokens off;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options nosniff;

    # ─────────────────────────────────────────────────────────
    # RATE LIMITING ZONES
    # Defined here at http level, applied inside location blocks
    #
    # $binary_remote_addr — tracks by client IP (binary = compact storage)
    # zone=name:size      — shared memory zone name and size
    #                       10m holds ~160,000 IPs
    # rate                — max allowed requests per interval
    #
    # Two zones — stricter for auth, relaxed for general API:
    # auth_limit: 10 requests/min  — prevents brute force login attacks
    # api_limit:  100 requests/min — general API usage limit per IP
    # ─────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;

    # ─────────────────────────────────────────────────────────
    # UPSTREAM (LOAD BALANCING)
    # Defines the backend server(s) Nginx proxies requests to
    #
    # 'app' — Docker service name, Docker DNS resolves it to
    #          the Node.js container IP automatically
    # 5000  — port your Node app listens on inside the container
    #
    # keepalive 32 — keep 32 persistent connections open between
    #                Nginx and Node — avoids reconnecting every request
    #
    # To scale later, just uncomment additional servers:
    # Nginx will round-robin between them automatically
    # ─────────────────────────────────────────────────────────
 
    upstream lms_backend {
        server app1:5000;
        # server app2:5000;   # uncomment when scaling up
        # server app3:5000;   # uncomment when scaling up
        keepalive 32;
    }

    # ─────────────────────────────────────────────────────────
    # HTTP SERVER — PORT 80
    #
    # LOCAL (now):
    #   Handles requests directly — proxies to Node app
    #   SSL not active yet, no certs available locally
    #
    # AWS EC2 (later):
    #   Remove all location blocks below
    #   Uncomment the return 301 line
    #   This block becomes a pure redirect to HTTPS
    # ─────────────────────────────────────────────────────────
    server {
        listen 80;

        # LOCAL: _ means catch-all (any hostname)
        # AWS EC2: replace _ with your actual domain
        #   server_name yourdomain.com www.yourdomain.com;
        server_name _;

        # AWS EC2: uncomment this and remove all location blocks below
        # return 301 https://$host$request_uri;

        # ─────────────────────────────────────────────────────
        # AUTH ROUTES — STRICT RATE LIMIT
        # /api/auth/ matched first (more specific than /api/)
        #
        # burst=5    — allows 5 extra requests above the rate limit
        #              queued up before rejecting
        # nodelay    — process burst requests immediately, don't queue
        #              (queuing adds latency — nodelay is better for APIs)
        # 429        — return HTTP 429 Too Many Requests when exceeded
        # ─────────────────────────────────────────────────────
        location /api/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429;

            proxy_pass http://lms_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ─────────────────────────────────────────────────────
        # ALL OTHER API ROUTES — NORMAL RATE LIMIT
        #
        # burst=20 — allows 20 extra requests above limit
        # Upgrade + Connection headers — enable WebSocket support
        # proxy_cache_bypass — don't serve cached response for
        #                      WebSocket upgrade requests
        # ─────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://lms_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
        }

        # ─────────────────────────────────────────────────────
        # CATCH-ALL — everything else
        # ─────────────────────────────────────────────────────
        location / {
            proxy_pass http://lms_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}